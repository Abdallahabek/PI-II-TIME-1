<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Demand Tracking</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="wrapper">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="sidebar-brand">
                <div class="logo-icon">DT</div>
                <span style="font-size: 0.9rem; line-height: 1.1;">Development Demand<br>Tracking System</span>
            </div>
            <div class="mt-3">
                <a href="dashboard.html" class="nav-link active">
                    <i class="fa-solid fa-border-all"></i> Dashboard
                </a>
                <a href="demandas.html" class="nav-link">
                    <i class="fa-regular fa-clipboard"></i> Demandas
                </a>
                <a href="#" class="nav-link">
                    <i class="fa-solid fa-gear"></i> Configurações
                </a>
                <a href="login.html" class="nav-link mt-5 text-danger">
                    <i class="fa-solid fa-arrow-right-from-bracket"></i> Sair
                </a>
            </div>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <div class="topbar">
                <h5 class="m-0 text-dark">Bem-vindo, Aluno</h5>
                <div class="user-info">
                    Bem-vindo, Aluno
                    <div class="user-avatar">
                        <i class="fa-solid fa-user"></i>
                    </div>
                </div>
            </div>

            <div class="p-4">
                <!-- Cards de Metricas Zerados -->
                <div class="row mb-2">
                    <div class="col-md-3">
                        <div class="card card-custom card-metric">
                            <div class="metric-title">Total Demandas</div>
                            <h2 class="metric-value">0</h2>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="card card-custom card-metric">
                            <div class="metric-title">Em Andamento</div>
                            <h2 class="metric-value">0</h2>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="card card-custom card-metric">
                            <div class="metric-title">Concluídas</div>
                            <h2 class="metric-value">0</h2>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="card card-custom card-metric">
                            <div class="metric-title">Aguardando</div>
                            <h2 class="metric-value">0</h2>
                        </div>
                    </div>
                </div>

                <div class="row">
                    <!-- Gráfico de Barras -->
                    <div class="col-md-8">
                        <div class="card card-custom h-100">
                            <div class="card-header-custom">Demandas por Mês</div>
                            <div class="card-body d-flex align-items-center justify-content-center">
                                <!-- Gráfico vazio / zerado -->
                                <canvas id="barChart" height="120"></canvas>
                            </div>
                        </div>
                    </div>

                    <!-- Gráfico de Rosca e Atividade -->
                    <div class="col-md-4">
                        <div class="card card-custom mb-4">
                            <div class="card-header-custom">Status das Demandas</div>
                            <div class="card-body">
                                <canvas id="doughnutChart" height="200"></canvas>
                            </div>
                        </div>

                        <div class="card card-custom">
                            <div class="card-header-custom">Atividade Recente</div>
                            <div class="card-body">
                                <ul class="list-unstyled mb-0" style="font-size: 0.9rem;">
                                    <li class="text-center text-muted py-3">
                                        Nenhuma atividade recente registrada.
                                    </li>
                                </ul>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- Script para renderizar os gráficos zerados -->
    <script>
        // Gráfico de Barras zerado
        const ctxBar = document.getElementById('barChart').getContext('2d');
        new Chart(ctxBar, {
            type: 'bar',
            data: {
                labels: ['Jan', 'Fev', 'Mar', 'Abr', 'Mai'],
                datasets: [{
                    label: 'Demandas',
                    data: [0, 0, 0, 0, 0], // Valores zerados
                    backgroundColor: '#e2e8f0',
                    borderColor: '#cbd5e1',
                    borderWidth: 1
                }]
            },
            options: {
                plugins: { legend: { display: false } },
                scales: {
                    y: { beginAtZero: true, max: 10, ticks: { stepSize: 2 } }
                }
            }
        });

        // Gráfico de Rosca zerado (exibindo um arco cinza para indicar vazio)
        const ctxDoughnut = document.getElementById('doughnutChart').getContext('2d');
        new Chart(ctxDoughnut, {
            type: 'doughnut',
            data: {
                labels: ['Sem dados'],
                datasets: [{
                    data: [1], // 1 apenas para desenhar o circulo cinza
                    backgroundColor: ['#f1f5f9'],
                    borderColor: ['#e2e8f0'],
                    borderWidth: 1
                }]
            },
            options: {
                cutout: '60%',
                plugins: {
                    legend: { display: false },
                    tooltip: { enabled: false }
                }
            }
        });
    </script>
</body>
</html>
