<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demandas - Development Demand Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="wrapper">
        <div class="sidebar">
            <div class="sidebar-brand">
                <div class="logo-icon">DT</div>
                <span style="font-size: 0.9rem; line-height: 1.1;">Development Demand<br>Tracking System</span>
            </div>
            <div class="mt-3">
                <a href="dashboard.html" class="nav-link">
                    <i class="fa-solid fa-border-all"></i> Dashboard
                </a>
                <a href="demandas.html" class="nav-link active">
                    <i class="fa-regular fa-clipboard"></i> Demandas
                </a>
                <a href="#" class="nav-link">
                    <i class="fa-solid fa-gear"></i> Configurações
                </a>
            </div>
        </div>

        <div class="main-content">
            <div class="topbar">
                <h5 class="m-0 text-dark">Bem-vindo, Aluno</h5>
                <div class="user-info">
                    Bem-vindo, Aluno
                    <div class="user-avatar"><i class="fa-solid fa-user"></i></div>
                </div>
            </div>

            <div class="p-4">
                <div class="card card-custom p-4">
                    <div class="d-flex justify-content-between mb-4">
                        <div class="input-group" style="max-width: 400px;">
                            <span class="input-group-text bg-white"><i class="fa-solid fa-magnifying-glass text-muted"></i></span>
                            <input type="text" class="form-control border-start-0 ps-0" placeholder="Pesquisar demanda...">
                        </div>
                        <div>
                            <button class="btn btn-light border text-muted me-2"><i class="fa-solid fa-filter"></i> Filtrar</button>
                            <a href="nova-demanda.html" class="btn btn-primary" style="background-color: #1e73be; border: none;">+ Nova Demanda</a>
                        </div>
                    </div>

                    <!-- Tabela Limpa -->
                    <div class="table-responsive">
                        <table class="table table-hover table-custom">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Título</th>
                                    <th>Solicitante</th>
                                    <th>Status</th>
                                    <th>Prioridade</th>
                                    <th>Data de Criação</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td colspan="6" class="text-center text-muted py-5">
                                        <i class="fa-regular fa-folder-open fs-2 mb-2 text-secondary"></i><br>
                                        Nenhuma demanda cadastrada no momento.
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>

                    <div class="d-flex justify-content-center mt-3">
                        <ul class="pagination pagination-sm">
                            <li class="page-item disabled"><a class="page-link" href="#">&lt;</a></li>
                            <li class="page-item active"><a class="page-link" href="#" style="background-color:#1e73be; border-color:#1e73be;">1</a></li>
                            <li class="page-item disabled"><a class="page-link" href="#">&gt;</a></li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
